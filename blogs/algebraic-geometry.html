# Why one should study Algebraic Geometry

## Introduction

Last two semesters during my Master's studies at [Kyiv School of Economics](kse.ua)
I took several advanced pure mathematics courses in commutative algebra, sheaf theory, and finally algebraic geometry.
To be completely honest, while I wanted to learn algebraic geometry (due to its extensive usage in pairing-based and isogeny-based cryptography), I was not completely sure why I needed to know that much of a commutative algebra, not to mention category theory and sheaves.
Like... Do I really need to know what is a tensor product of modules to understand construction of Tate pairing? 
And do I need to compute cohomology groups of structure sheaf to understand how to compute the number of points on an elliptic curve over a finite field?

However, after taking all these courses, I actually feel it was worth it!
The answer to the question "can I engineer a pairing-based scheme without knowing what is a sheaf?" is still "yes" though (and that what I was doing for the last four years), 
but did not feel like I understood what I was doing.
